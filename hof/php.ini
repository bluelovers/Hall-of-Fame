extension_dir = "D:\Users\WebstormProjects\php\bin\php-5.6.32-nts-Win32-VC11-x64\ext"
extension = php_mbstring.dll
date.timezone = "Asia/Taipei"

; include_path = "D:\Users\WebstormProjects\game\Hall-of-Fame\.codenomad\worktrees\develop5\hof\includes;."

; ==================== Xdebug 除錯設定 / Xdebug Debug Settings ====================
; Xdebug 擴展路徑 / Xdebug extension path
; 注意：請根據你的 PHP 版本和 Xdebug 版本調整檔案名稱
; Note: Please adjust the filename according to your PHP version and Xdebug version
; extension = php_xdebug.dll

; Xdebug 基本設定 / Xdebug basic settings
; 保持 debug 和 coverage 功能都開啟，讓 PHPUnit 能充分利用除錯功能
; Keep debug and coverage features enabled for PHPUnit to utilize debugging capabilities
xdebug.mode = debug,coverage
xdebug.start_with_request = yes

; 這樣設定確保：
; - 變數狀態監控：Variables in local scope
; - 函式參數追蹤：Function parameters and return values
; - 資源生命週期：Resource tracking
; - 與 PHP 錯誤對應：Detailed error context
; This configuration ensures:
; - Variable state monitoring: Variables in local scope
; - Function parameter tracing: Function parameters and return values
; - Resource lifecycle: Resource tracking
; - PHP error correlation: Detailed error context

; Xdebug 遠端除錯設定 / Xdebug remote debug settings
; 新版 Xdebug 3.x 設定 / Xdebug 3.x settings
xdebug.client_host = localhost
xdebug.client_port = 9003
xdebug.log = "D:/Users/WebstormProjects/game/Hall-of-Fame/.codenomad/worktrees/develop5/hof/trust_path/test/coverage-report/log/xdebug.log"

; 舊版 Xdebug 2.x 設定 / Xdebug 2.x settings
xdebug.remote_host = localhost
xdebug.remote_port = 9003
xdebug.remote_log = "D:/Users/WebstormProjects/game/Hall-of-Fame/.codenomad/worktrees/develop5/hof/trust_path/test/coverage-report/log/xdebug.log"

; Xdebug 2.2.7 特定設定 / Xdebug 2.2.7 specific settings
xdebug.remote_autostart = 0
xdebug.remote_enable = 1
xdebug.profiler_enable = 0
xdebug.collect_vars = 1
xdebug.collect_params = 1
xdebug.collect_return = 1
xdebug.show_local_vars = 1
xdebug.show_exception_trace = 1

; Xdebug IDE 設定 / Xdebug IDE settings
xdebug.idekey = PHPSTORM

; Xdebug 覆蓋率設定 / Xdebug coverage settings
xdebug.coverage_enable = 1
; 根據 phpunit.xml 的 whitelist 設定調整覆蓋率目錄
; Adjust coverage directories based on phpunit.xml whitelist settings
xdebug.coverage_exclude_directory = "./test/,./bin/,**/.codenomad/,**/^.*"
xdebug.coverage_include_directory = "./"

; Xdebug 效能設定 / Xdebug performance settings
xdebug.max_nesting_level = 256
xdebug.var_display_max_children = 128
xdebug.var_display_max_data = 512
xdebug.var_display_max_depth = 3

; ==================== PHP 錯誤報告設定 / PHP Error Reporting Settings ====================
; 顯示所有錯誤 / Display all errors
display_errors = On
error_reporting = E_ALL | E_STRICT

; 記錄錯誤到檔案 / Log errors to file
log_errors = On
error_log = "D:/Users/WebstormProjects/game/Hall-of-Fame/.codenomad/worktrees/develop5/hof/trust_path/test/coverage-report/log/php_errors.log"

; PHP 執行時間限制 / PHP execution time limit
max_execution_time = 300
max_input_time = 300

; 記憶體限制 / Memory limit
memory_limit = 512M

; 輸出緩衝 / Output buffering
output_buffering = 4096

; 檔案上傳設定 / File upload settings
upload_max_filesize = 64M
post_max_size = 64M

; ==================== PHPUnit 相關設定 / PHPUnit Related Settings ====================
; 這些 PHP 設定會影響 PHPUnit 的執行行為
; These PHP settings affect PHPUnit execution behavior

; 自動載入檔案 / Auto prepend file for PHPUnit
; auto_prepend_file = "D:/Users/WebstormProjects/game/Hall-of-Fame/.codenomad/worktrees/develop5/hof/trust_path/test/phpunit/prepend.php"

; 堆疊追蹤設定 / Stack trace settings
; 增加堆疊追蹤的詳細程度
; 這些設定有助於 PHPUnit 顯示更詳細的錯誤資訊
; These settings help PHPUnit display more detailed error information

; 錯誤處理設定 / Error handling settings
; 確保所有錯誤類型都被捕獲和報告
; Ensure all error types are caught and reported

; 輸出控制設定 / Output control settings
; 防止輸出緩衝影響測試結果
; Prevent output buffering from affecting test results
implicit_flush = On

; 檔案處理設定 / File handling settings
; 確保檔案操作的正確性
; Ensure correctness of file operations
allow_url_fopen = On
allow_url_include = Off

; 時區設定確認 / Timezone setting confirmation
; 確保時間相關測試的正確性
; Ensure correctness of time-related tests
; date.timezone 已在上方設定為 "Asia/Taipei"

; 字符集設定 / Character set settings
; 確保測試中的字符處理正確
; Ensure correct character handling in tests
default_charset = "UTF-8"
mbstring.internal_encoding = "UTF-8"
mbstring.http_input = "UTF-8"
mbstring.http_output = "UTF-8"

; 正則表達式設定 / Regular expression settings
; 提高正則表達式的效能和限制
; Improve regex performance and limits
pcre.backtrack_limit = 1000000
pcre.recursion_limit = 200000
